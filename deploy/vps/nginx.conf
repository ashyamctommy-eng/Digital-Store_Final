# Digital Hub Shop static export + PHP API
# Replace DOMAIN, WEB_ROOT, PHP_FPM_SOCKET, and certificate paths before use.

server {
    listen 80;
    server_name DOMAIN www.DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOMAIN www.DOMAIN;

    root WEB_ROOT;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    client_max_body_size 8m;

    location = /installer.sh {
        return 404;
    }

    # Keep runtime data and server configuration out of the public web root.
    location ^~ /api/data/ {
        deny all;
    }
    location ~* ^/api/config(\.sample)?\.php$ {
        deny all;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }

    # The PHP API uses extensionless routes (for example /api/admin/settings),
    # so resolve the matching .php file and let the PHP-FPM location execute it.
    location /api/ {
        try_files $uri $uri/ $uri.php =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:PHP_FPM_SOCKET;
    }

    # Next.js static export: each route is a directory with an index.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
